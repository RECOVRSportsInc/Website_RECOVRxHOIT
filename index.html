<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Base title and description (used by Google) -->
    <title>
      Hands On Integrative Therapy &amp; RECOVR Sports | Athletic Therapy, VR
      Rehab, Massage in Montreal
    </title>
    <meta
      name="description"
      content="Hands On Integrative Therapy offers athletic therapy and massage therapy in Montreal. Explore RECOVR Sports for virtual reality based rehab and high performance sports therapy."
    />

    <!-- Favicon (keep your existing logo here) -->
    <link rel="icon" type="image/png" href="/img/recovr-logo.png" />

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.handsonintegrativetherapy.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:site_name" content="RECOVR Sports + Hands On Integrative Therapy" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Hands On Integrative Therapy &amp; RECOVR Sports"
    />
    <meta
      property="og:description"
      content="Virtual reality based rehab and high performance sports therapy in Montreal, plus hands-on athletic therapy and massage."
    />
    <meta
      property="og:url"
      content="https://www.handsonintegrativetherapy.com/"
    />
    <meta
      property="og:image"
      content="https://www.handsonintegrativetherapy.com/img/og-main.jpg"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RECOVR Sports + Hands On Integrative Therapy"
    />
    <meta
      name="twitter:description"
      content="Virtual reality rehab, athletic therapy, and massage therapy in Montreal."
    />
    <meta
      name="twitter:image"
      content="https://www.handsonintegrativetherapy.com/img/og-main.jpg"
    />
  </head>

  <body class="bg-black text-white">
    <div id="root"></div>
    <!-- Vite injects the React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
